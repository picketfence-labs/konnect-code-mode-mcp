# Insurance bundle の k8s/services/services.yaml を基にした固定コピーです。
# イメージタグは v0.1.1 に固定し、既存 insurance namespace のサービスを再現します。
# 更新は bundle の変更を確認した PR で明示的に取り込みます。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: insurance
  labels: { app: product }
spec:
  replicas: 1
  selector: { matchLabels: { app: product } }
  template:
    metadata:
      labels: { app: product }
    spec:
      containers:
        - name: product
          image: ghcr.io/picketfence-labs/insurance-product:v0.1.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: insurance
spec:
  selector: { app: product }
  ports: [{ port: 8000, targetPort: 8000 }]
