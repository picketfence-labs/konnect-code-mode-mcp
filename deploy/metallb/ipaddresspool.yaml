# MetalLB のアドレスプール設定。
# minikube の metallb addon は MetalLB v0.9.6（ConfigMap 方式、CRD 非対応）を入れるため、
# IPAddressPool CRD ではなく metallb-system/config ConfigMap で設定する。
#
# minikube の docker network (192.168.49.0/24) の未使用レンジを LoadBalancer 用に払い出す。
# .1 = gateway, .2 = ノード。衝突を避けて .200-.250 を割当。
#
# 適用: kubectl apply -f deploy/metallb/ipaddresspool.yaml
#      （反映のため controller を再起動: kubectl -n metallb-system rollout restart deploy/controller）
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
  namespace: metallb-system
data:
  config: |
    address-pools:
    - name: default
      protocol: layer2
      addresses:
      - 192.168.49.200-192.168.49.250
